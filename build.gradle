plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cafetecnologico.convertidor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cafetecnologico.convertidor'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
