plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cafetecnologico.convertidor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cafetecnologico.convertidor'
        minSdk 29
        targetSdk 34
        versionCode 13
        versionName '1.9.0'
    }

    sourceSets {
        main {
            // Manifiesto propio, en la raíz del repositorio: resuelve los conflictos con la
            // librería MP3 (allowBackup y label). El flujo de compilación aún escribe otro en
            // src/main, pero se ignora.
            manifest.srcFile 'AndroidManifest.xml'
        }
        // Manifiesto adicional: permite a la app ver qué motores de texto a voz hay instalados
        // (Android 11 en adelante lo exige). Se fusiona con el manifiesto principal.
        release {
            manifest.srcFile 'AndroidManifest-motores.xml'
        }
        debug {
            manifest.srcFile 'AndroidManifest-motores.xml'
        }
    }

    signingConfigs {
        release {
            // La llave llega desde GitHub Actions (secretos). Sin ella no se firma.
            def archivoLlave = System.getenv('KEYSTORE_FILE')
            if (archivoLlave) {
                storeFile file(archivoLlave)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'cafetecnologico'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Codificador MP3 (LAME). Se descarga desde JitPack.
    implementation 'com.github.naman14:TAndroidLame:1.1'
}
