plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cafetecnologico.convertidor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cafetecnologico.convertidor'
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName '1.3.2'
    }

    signingConfigs {
        release {
            // La llave llega desde GitHub Actions (secretos). Sin ella no se firma.
            def archivoLlave = System.getenv('KEYSTORE_FILE')
            if (archivoLlave) {
                storeFile file(archivoLlave)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'cafetecnologico'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
